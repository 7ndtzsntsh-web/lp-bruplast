<!DOCTYPE html>
<!-- Molde da imagem de prévia (og-capa.jpg, 1200x630) e dos ícones. Gerado por build/og.cjs. Não vai para o site. -->
<html lang="pt-BR"><head><meta charset="UTF-8"><style>
@font-face{font-family:Outfit;font-weight:100 900;src:url('../fonts/outfit-var.woff2') format('woff2')}
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#000;font-family:Outfit,sans-serif;color:#fff;position:relative;overflow:hidden}
.pontos{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.1) 1px,transparent 1px);background-size:24px 24px}
.brilho{position:absolute;width:760px;height:760px;left:-160px;top:-120px;background:radial-gradient(closest-side,rgba(227,21,30,.28),transparent)}
.texto{position:absolute;left:70px;top:70px;width:560px}
.logo{width:470px;display:block;margin-bottom:46px}
h1{font-size:54px;line-height:1.05;font-weight:800;letter-spacing:-1px;margin-bottom:22px}
h1 span{color:#F2353D}
p{font-size:25px;color:#d4d4d8;font-weight:300;line-height:1.35}
.selo{position:absolute;left:70px;bottom:58px;font-size:22px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#fff;background:#E3151E;padding:14px 26px;border-radius:999px}
.fotos{position:absolute;right:40px;top:40px;width:500px;height:550px}
.fotos img{position:absolute;width:330px;border-radius:22px;border:2px solid rgba(255,255,255,.12);box-shadow:0 30px 60px rgba(0,0,0,.7)}
.f1{left:0;top:40px;transform:rotate(-6deg)}
.f2{right:0;top:0;transform:rotate(4deg)}
.f3{left:70px;bottom:10px;width:360px!important;transform:rotate(1deg)}
.icone{width:512px;height:512px;background:#000;display:flex;align-items:center;justify-content:center;border-radius:0}
</style></head><body>
<div class="brilho"></div><div class="pontos"></div>
<div class="texto">
  <img class="logo" src="../img/logo-branco.svg" alt="">
  <h1>Sacolas, sacos e bobinas <span>com a sua marca.</span></h1>
  <p>Embalagens de polietileno sob medida, lisas ou impressas.</p>
</div>
<div class="selo">Brusque/SC · desde 2001</div>
<div class="fotos">
  <img class="f1" src="../img/trabalho-euphoria-640.webp" alt="">
  <img class="f2" src="../img/trabalho-alimentos-640.webp" alt="">
  <img class="f3" src="../img/trabalho-cosh-640.webp" alt="">
</div>
</body></html>
